name: Python QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Verify synthetic fixture consistency
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.generate_synthetic_data import SPECS, make_scenario

          recorded = json.loads(Path('data/synthetic/scenarios.json').read_text(encoding='utf-8'))
          generated = [make_scenario(spec) for spec in SPECS]
          assert recorded == generated, 'Synthetic dataset differs from its generator'
          print('PASS: synthetic dataset matches generator')
          PYCODE

      - name: Verify synthetic dataset and SQLite audit
        run: python scripts/verify_synthetic_data.py
